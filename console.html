<!doctype html>
<html lang="en" data-console-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<title>Platform Control Center</title>
		<meta
			name="description"
			content="Administration console for the educational platform: organizations, users, analytics, audit and system health."
		/>
		<link rel="stylesheet" href="/console-bundle.css" />
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 10v6M2 10l10-5 10 5-10 5-10-5z'/%3E%3Cpath d='M6 12v5c3 3 9 3 12 0v-5'/%3E%3C/svg%3E"
		/>
	</head>
	<body class="ac-body">
		<!-- Boot screen: replaced by the console shell once the session is
		     resolved. Kept in the HTML so the page never renders empty. -->
		<div id="ac-boot" class="ac-boot">
			<div class="ac-boot__mark" aria-hidden="true">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					width="28"
					height="28"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
				>
					<path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z" />
					<path d="M6 12v5c3 3 9 3 12 0v-5" />
				</svg>
			</div>
			<p class="ac-boot__title">Platform Control Center</p>
			<p class="ac-boot__status" id="ac-boot-status">Resolving your session…</p>
		</div>

		<div id="ac-root" class="ac-root" hidden></div>

		<noscript>
			<div class="ac-boot">
				<p class="ac-boot__title">Platform Control Center</p>
				<p class="ac-boot__status">
					This console requires JavaScript. Enable it and reload.
				</p>
			</div>
		</noscript>

		<script src="/console-bundle.js" defer></script>
	</body>
</html>
