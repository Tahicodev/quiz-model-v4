# Quiz Application — SaaS deployment stack
# Docker Compose for a production-like, single-node, MULTI-TENANT deployment.
#
# ── WHY SQLITE AND NOT POSTGRESQL ────────────────────────────────────────────
# The Prisma migration history in prisma/migrations is written for SQLite
# (SQLite DDL: TEXT/INTEGER/DATETIME, PRAGMA foreign_keys, table-rebuild
# RENAME TO). The datasource in prisma/schema.prisma is likewise pinned to
# `provider = "sqlite"`, and the generated client is SQLite-only.
#
# Setting DB_PROVIDER=postgresql here did NOT produce a Postgres deployment:
# the generated client still spoke SQLite and the container crashed on the
# first query. Rewriting the 22 existing migrations is not an option (they are
# the deployed history), and a second, parallel Postgres migration tree could
# not be verified in this environment — so it has NOT been written.
#
# This stack therefore runs the multi-tenant platform on SQLite, which is
# fully supported: one server, many organizations, real tenant isolation.
# See docs/DEPLOYMENT.md → "PostgreSQL" for what a Postgres deployment would
# require.
#
# ── REQUIRED ────────────────────────────────────────────────────────────────
# A .env file with at least:
#     JWT_SECRET=<64+ hex characters>
#     BOOTSTRAP_ADMIN_PASSWORD=<the administrator's first password>
# The first boot prints a one-time administrator password if
# BOOTSTRAP_ADMIN_PASSWORD is not set — read it from `docker compose logs app`.

services:

  # ── Quiz App Backend ────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Bound to every interface so the platform is reachable. Put a TLS
      # reverse proxy in front of this and bind to 127.0.0.1:3000 instead.
      - "3000:3000"
    environment:
      # ── Deployment mode ────────────────────────────────────────────────────
      # 'saas'   → multi-tenant platform (this stack)
      # 'offline' → a school installation on its own machine
      DEPLOYMENT_MODE:  saas
      NODE_ENV:          production

      # ── Database ───────────────────────────────────────────────────────────
      # The provider is fixed by the Prisma schema and the migration history.
      DB_PROVIDER:       sqlite
      DATABASE_URL:      "file:./dev.db"

      # ── Auth ───────────────────────────────────────────────────────────────
      JWT_SECRET:        ${JWT_SECRET:?set JWT_SECRET in .env (64+ hex characters)}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      BCRYPT_ROUNDS:     12
      # The refresh cookie must carry `Secure` behind a TLS-terminating proxy.
      # Set to "true" when the public URL is https://.
      COOKIE_SECURE:     ${COOKIE_SECURE:-false}

      # ── Server ─────────────────────────────────────────────────────────────
      PORT:              3000
      CORS_ORIGIN:       ${CORS_ORIGIN:-http://localhost:3000}
      LOG_LEVEL:         info
      DEFAULT_SCHOOL_ID: ${DEFAULT_SCHOOL_ID:-saas-default}

      # ── Redis (optional) ───────────────────────────────────────────────────
      # Only needed for a MULTI-INSTANCE deployment (several app containers
      # behind a load balancer). Leave empty for a single node.
      REDIS_URL:         ${REDIS_URL:-}

      # ── First-run administrator ────────────────────────────────────────────
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      # The SQLite database AND the migration history live here. The named
      # volume is seeded from the image on first creation, so `migrate deploy`
      # finds the migrations; later image updates do NOT refresh them, so
      # re-run the migrations after an upgrade that adds one.
      - quiz-data:/app/prisma
      # Uploaded images and generated documents MUST survive a container
      # recreate — they are referenced by relative URL from the database.
      - quiz-uploads:/app/uploads
    # Healthcheck is in the Dockerfile

  # ── Redis (Socket.io adapter — multi-instance only) ─────────────────────────
  # Started on demand:  docker compose --profile mult-instance up -d
  redis:
    image: redis:7-alpine
    profiles: ["mult-instance"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  quiz-data:
  quiz-uploads:
