<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Modern Quiz App</title>
		<link
			rel="icon"
			type="image/x-icon"
			href="data:image/x-icon;base64,AAABAAEAEBAAAAEAIABoBAAAFgAAACgAAAAQAAAAIAAAAAEAIAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
		/>
		<link rel="stylesheet" href="styles.css?v=2026-09-09-realtime-r6" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
		/>

		<script>
			window.APP_CONFIG = window.APP_CONFIG || {
				mode: 'local',
				apiUrl: '/api/v1',
				socketUrl: '/',
			};
		</script>

			<!-- Legacy Bridge — must load synchronously (defines globals used by getSocket) -->
			<script src="legacy-bridge.js?v=2026-09-09-realtime-r6"></script>
			<!-- Socket auth keeper — heals sockets whose token expired or was
			     replaced by another tab's login (shared localStorage). -->
			<script src="socket-auth-keeper.js?v=2026-09-09-realtime-r6" defer></script>
			<!-- getSocket bridges io() calls → passes JWT auth token to socket.io -->
			<script>
				window.getSocket =
					window.getSocket ||
					function (url, opts) {
						if (!window.io) {
							console.warn('getSocket called before Socket.IO loaded');
							return null;
						}
						if (window.__AUTH_SESSION_EXPIRED__) return null;
						// Consult the keeper when the cached socket exists: it heals
						// sockets killed by a REST 401 (manual disconnect never retries)
						// and re-authenticates ones carrying another tab's identity,
						// before we hand the cached object out.
						var keeper = window.__QUIZ_SOCKET_AUTH_KEEPER__;
						if (window.__QUIZ_LEGACY_SOCKET__ && keeper) {
							try { keeper.reviveCachedSocket(); } catch (e) {}
							keeper.attachSocketGuards(window.__QUIZ_LEGACY_SOCKET__);
							return window.__QUIZ_LEGACY_SOCKET__;
						}
						if (window.__QUIZ_LEGACY_SOCKET__) return window.__QUIZ_LEGACY_SOCKET__;
						// This tab's session wins over the shared localStorage copy
						// (which may hold another tab's login from this browser).
						var token =
							(keeper && keeper.getActiveToken()) ||
							window.__authToken ||
							(function () {
								try {
									var s = JSON.parse(
										localStorage.getItem('quizSession') || 'null',
									);
									return s && s.token;
								} catch (e) {}
							})() ||
							localStorage.getItem('quizAuthToken') ||
							'';
						// SaaS-only sockets always require authentication. Skip the
						// connection attempt when anonymous — the socket auth
						// middleware will reject it anyway, and we'd just spam the
						// console with "WebSocket closed before the connection is
						// established" noise. Callers must handle a null return.
						if (!token) return null;
						var socket = window.io(
							url || '/',
							Object.assign(
								{ auth: { token: token }, transports: ['polling', 'websocket'] },
								opts || {},
							),
						);
						window.__QUIZ_LEGACY_SOCKET__ = socket;
						if (keeper) keeper.attachSocketGuards(socket);
						return socket;
					};
		</script>

		<script src="https://cdn.socket.io/4.5.4/socket.io.min.js" defer></script>
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
			defer
		></script>

		<!-- Student SPA shell -->
		<script src="public/student-bundle.js?v=2026-09-09-realtime-r6" defer></script>
	</head>
	<body>
		<!-- The single root container that the new student SPA mounts into -->
		<main id="app"></main>
	</body>
</html>
