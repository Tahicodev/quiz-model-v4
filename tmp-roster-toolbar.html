							<div class="toolbar roster-main-toolbar">
								<div class="toolbar-header-group">
									<div class="roster-title-block">
										<h2>Class Roster</h2>
										<span class="roster-summary-badge" id="assignClassRosterSummary">0 student(s)</span>
									</div>
									<div class="roster-add-actions">
										<button
											type="button"
											class="mobile-filters-toggle"
											data-filter-target="#studentRosterFilterControls"
											onclick="toggleMobileFilters(this)"
											aria-expanded="false"
										>
											<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
											<span class="mobile-filters-toggle-label">Filters</span>
											<span class="mobile-filters-count hidden">0</span>
											<svg class="mobile-filters-chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
										</button>
										<button
											type="button"
											class="btn btn-outline"
											onclick="openAddStudentModal()"
											title="Add a student without an account (number + name only)"
										>
											<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
											<span>Add Student</span>
										</button>
										<button
											type="button"
											id="addStudentsPickerBtn"
											class="btn btn-primary"
											onclick="openAddStudentsPickerModal()"
											title="Add students from existing user accounts"
										>
											<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>
											<span>Add Students</span>
										</button>
									</div>
								</div>
							</div>

							<div class="roster-filter-shell">
								<div class="roster-filter-controls collapsible-filter-controls" id="studentRosterFilterControls">
									<div class="roster-filter-search">
										<label for="studentRosterSearch">Search</label>
										<div class="search-wrapper">
											<input
												type="text"
												id="studentRosterSearch"
												placeholder="Name or student #…"
												onkeyup="filterStudentRosterTable()"
											/>
										</div>
									</div>
									<div class="filter-group">
										<label for="studentRosterStatusFilter">Status</label>
										<select id="studentRosterStatusFilter" class="form-control" onchange="filterStudentRosterTable()">
											<option value="all">All statuses</option>
											<option value="active">Active</option>
											<option value="disabled">Disabled</option>
											<option value="no-account">No account yet</option>
										</select>
									</div>
									<div class="filter-group" id="studentRosterSortWrap">
										<label for="studentRosterSortBy">Sort</label>
										<div class="sort-wrapper">
											<select id="studentRosterSortBy" class="form-control" onchange="sortStudentRoster()">
												<option value="name">Name</option>
												<option value="number">Student #</option>
												<option value="status">Status</option>
											</select>
											<button
												id="sortRosterDirection"
												class="btn-icon"
												onclick="toggleRosterSortDirection()"
												title="Toggle sort direction"
											>
												<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M19 12l-7 7-7-7" /></svg>
											</button>
										</div>
									</div>
									<div class="roster-filter-io" id="rosterCsvActions">
										<button
											type="button"
											class="btn btn-sm btn-outline"
											onclick="exportStudents()"
											title="Export roster as CSV"
										>
											<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
											<span>Export CSV</span>
										</button>
										<button
											type="button"
											class="btn btn-sm btn-outline"
											onclick="importStudents()"
											title="Import roster from CSV"
										>
											<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
											<span>Import CSV</span>
										</button>
									</div>
								</div>
								<div class="roster-filter-summary hidden" id="rosterFilterSummary">
									<span class="roster-filter-summary-label">Filtered by</span>
									<div class="roster-filter-chips" id="rosterFilterChips"></div>
									<button type="button" class="roster-filter-clear" onclick="clearStudentRosterFilters()">Clear all</button>
								</div>
							</div>

							<div id="bulk-actions-students" class="bulk-actions-container roster-bulk-bar hidden">
								<span class="selection-info">
									<span id="selected-count-students">0</span> selected
								</span>
								<div class="roster-bulk-actions">
									<button
										type="button"
										id="bulkEnableStudentsBtn"
										class="btn btn-success-soft admin-only-bulk-action"
										onclick="bulkSetStudentAccounts('active')"
										title="Activate the selected students' accounts"
									>
										<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
										<span>Enable</span>
									</button>
									<button
										type="button"
										id="bulkDisableStudentsBtn"
										class="btn btn-warning-soft admin-only-bulk-action"
										onclick="bulkSetStudentAccounts('disabled')"
										title="Suspend the selected students' accounts"
									>
										<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
										<span>Disable</span>
									</button>
									<button
										type="button"
										class="btn btn-outline"
										onclick="exportSelectedStudents()"
										title="Export the selected students as CSV"
									>
										<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
										<span>Export</span>
									</button>
									<button
										type="button"
										class="btn btn-danger-soft"
										onclick="deleteSelectedStudents()"
										title="Remove the selected students from the roster"
									>
										<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
										<span>Remove</span>
									</button>
									<button
										type="button"
										class="btn btn-ghost"
										onclick="window.BulkSelect && window.BulkSelect.clear('students')"
										title="Clear the current selection"
									>
										Clear selection
									</button>
								</div>
							</div>
